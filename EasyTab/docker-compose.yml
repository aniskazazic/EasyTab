services:
  easytab-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: easytab-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1432:1433"
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - easytabnetwork
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  
  easytab-api:
    build: 
      context: .
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__EasyTabConnection=Server=easytab-sql;Database=220030;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - RabbitMQ__Host=easytab-rabbitmq
    ports:
      - "5241:5241"
    expose:
      - "5241"
    depends_on:
      easytab-sql:
        condition: service_healthy
      easytab-rabbitmq:
        condition: service_healthy
    links:
        - easytab-sql
    networks:
      - easytabnetwork

  easytab-rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
      - "5672:5672"
    expose:
      - "15672"
      - "5672"
    networks:
      - easytabnetwork
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  easytab-subscriber:
    build:
      context: .
      dockerfile: EasyTab.Subscriber/Dockerfile
    container_name: easytab-subscriber
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RabbitMQ__Host=easytab-rabbitmq
    depends_on:
      easytab-rabbitmq:
        condition: service_healthy
    networks:
      - easytabnetwork


volumes:
  sqlserver_data:

networks:
  easytabnetwork:
    driver: bridge